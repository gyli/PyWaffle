[build-system]
# 77 is the first setuptools that understands PEP 639, which is what `license = "MIT"` and
# `license-files` below are. An older one fails metadata generation outright:
#   configuration error: `project.license` must be valid exactly by one definition
# Build isolation hides that by always fetching the newest setuptools, so the floor only
# bites a build with --no-build-isolation: conda-forge, distro packaging, offline CI.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pywaffle"
dynamic = ["version"]
description = "PyWaffle is an open source, MIT-licensed Python package for plotting waffle charts."
readme = { file = "README_pypi.rst", content-type = "text/x-rst" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Guangyang Li", email = "mail@guangyangli.com" }]
keywords = [
    "matplotlib",
    "waffle chart",
    "square pie chart",
    "pictogram chart",
    "pie plot",
    "data visualization",
]
# matplotlib 3.6 is the first with Figure.set_layout_engine, which _apply_layout_engine uses
# in place of the deprecated set_tight_layout. Without the floor, installing into an
# environment that already pins an older matplotlib leaves the pin in place and every figure
# then raises AttributeError.
# Font Awesome is only needed to draw with icons, so it is an extra rather than a hard
# dependency: pip install "pywaffle[icons]". Requesting icons without it raises ImportError
# with installation instructions.
dependencies = ["matplotlib>=3.6"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
icons = ["fontawesomefree"]

[project.urls]
Homepage = "https://github.com/gyli/PyWaffle"
Documentation = "https://pywaffle.readthedocs.io/"
Changelog = "https://github.com/gyli/PyWaffle/blob/master/CHANGELOG.md"
Issues = "https://github.com/gyli/PyWaffle/issues"

[tool.setuptools]
packages = ["pywaffle"]

[tool.setuptools.dynamic]
version = { attr = "pywaffle._version.__version__" }

[tool.setuptools.package-data]
pywaffle = ["py.typed"]

[tool.black]
line-length = 120
target-version = ['py39']
include = '\.pyi?$'
