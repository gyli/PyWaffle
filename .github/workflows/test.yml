name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[icons]"
          # pandas is not a dependency, but the Series-input tests need it present to run
          pip install pytest pytest-cov pandas

      - name: Test
        env:
          MPLBACKEND: Agg
        run: pytest tests -v --cov=pywaffle --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
        continue-on-error: true

  deprecations:
    # Matplotlib deprecations have broken this package before, so surface them early. A deprecation
    # is not necessarily ours to fix and should not block a merge, so only that step tolerates
    # failure -- the job itself does not. A broken environment or a genuinely failing suite fails
    # the job, which is what a job-level continue-on-error would have hidden.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[icons]" pytest pandas

      - name: The suite must pass normally
        env:
          MPLBACKEND: Agg
        run: pytest tests -q

      - name: Deprecation warnings as errors (advisory)
        id: deprecations
        continue-on-error: true
        env:
          MPLBACKEND: Agg
        run: pytest tests -W error::DeprecationWarning -W error::PendingDeprecationWarning -q

      - name: Report the result where it can be seen
        run: |
          if [ "${{ steps.deprecations.outcome }}" = "failure" ]; then
            echo "### :warning: Deprecation warnings" >> "$GITHUB_STEP_SUMMARY"
            echo "The suite passes, but raises deprecation warnings. Not blocking, worth a look." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### :white_check_mark: No deprecation warnings" >> "$GITHUB_STEP_SUMMARY"
          fi

  matplotlib-prerelease:
    # A pre-release breaking is matplotlib's business until it ships, so it does not block. The
    # same split applies: the suite has to pass on the released matplotlib first, so that a failure
    # here means the pre-release changed something rather than that this job is misconfigured.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[icons]" pytest pandas

      - name: The suite must pass on the released matplotlib
        env:
          MPLBACKEND: Agg
        run: pytest tests -q

      - name: Install the matplotlib pre-release
        id: prerelease
        continue-on-error: true
        run: |
          pip install --upgrade --pre matplotlib
          python -c "import matplotlib; print('matplotlib', matplotlib.__version__)"

      - name: Run against the pre-release (advisory)
        id: against_prerelease
        continue-on-error: true
        env:
          MPLBACKEND: Agg
        run: pytest tests -q

      - name: Report the result where it can be seen
        run: |
          if [ "${{ steps.prerelease.outcome }}" = "failure" ]; then
            echo "### :grey_question: No matplotlib pre-release available" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.against_prerelease.outcome }}" = "failure" ]; then
            echo "### :warning: Fails against the matplotlib pre-release" >> "$GITHUB_STEP_SUMMARY"
            echo "The suite passes on the released matplotlib, so the pre-release changed something." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### :white_check_mark: Passes against the matplotlib pre-release" >> "$GITHUB_STEP_SUMMARY"
          fi

  images:
    # Image comparison catches regressions that block-by-block assertions cannot: a layout engine
    # change, a matplotlib default moving, a legend drifting over the chart.
    #
    # The baselines are generated on macOS and compared here on Linux. That works because
    # matplotlib ships its own fonts, so text renders identically on both. Regenerate with:
    #   pytest tests/test_images.py --mpl-generate-path=tests/baseline
    # The uploaded summary shows which images differ and by how much when one fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[icons]" pytest pytest-mpl
      - name: Compare against baselines
        env:
          MPLBACKEND: Agg
        run: >
          pytest tests/test_images.py --mpl
          --mpl-generate-summary=html
          --mpl-results-path=image-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: image-comparison-results
          path: image-results/

  examples:
    # Everything the documentation shows has to still run. The example scripts and the demo
    # notebook exercise argument combinations the test suite does not, so a stricter validation
    # rule or a renamed parameter can break what the docs tell people to type while every test
    # still passes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[icons]" pandas nbconvert nbformat ipykernel

      - name: Regenerate the documented examples
        env:
          MPLBACKEND: Agg
        run: python -m examples.generate_plots

      - name: Execute the demo notebook
        run: |
          python -m ipykernel install --user --name demo
          jupyter nbconvert --to notebook --execute --stdout \
            --ExecutePreprocessor.kernel_name=demo \
            --ExecutePreprocessor.timeout=300 demo.ipynb > /dev/null

      - name: Check every image the docs reference exists
        run: |
          python - <<'PY'
          import pathlib, re, sys
          missing = []
          for page in pathlib.Path("docs").rglob("*.md"):
              for src in re.findall(r'src="[^"]*examples/([^"?]+)', page.read_text()):
                  if not pathlib.Path("examples") .joinpath(src).exists():
                      missing.append(f"{page}: {src}")
          for page in [pathlib.Path("README.md")]:
              for src in re.findall(r'!\[[^\]]*\]\((examples/[^)]+)\)', page.read_text()):
                  if not pathlib.Path(src).exists():
                      missing.append(f"{page}: {src}")
          print("\n".join(missing) if missing else "every referenced image exists")
          sys.exit(1 if missing else 0)
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install black
      - run: black --check --diff pywaffle tests

  build:
    # The package was unbuildable by every PEP 517 frontend for two years because nothing
    # ever tried. This job tries.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      # Font Awesome is an extra, so both installation modes are worth proving: the plain install
      # must draw blocks and must refuse icons with a useful message, and the [icons] install must
      # draw icons.
      - name: Install each artifact plain, and check icons are refused helpfully
        run: |
          for artifact in dist/*.tar.gz dist/*.whl; do
            rm -rf /tmp/plain-env
            python -m venv /tmp/plain-env
            /tmp/plain-env/bin/pip install --quiet "$artifact"
            MPLBACKEND=Agg /tmp/plain-env/bin/python - "$artifact" <<'PY'
          import sys
          import matplotlib; matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          from pywaffle import Waffle

          figure = plt.figure(FigureClass=Waffle, rows=5, values=[10, 20])
          assert len(figure.axes[0].patches) == 30, "plain install cannot draw blocks"

          try:
              plt.figure(FigureClass=Waffle, rows=5, values=[10, 20], icons="star")
          except ImportError as exc:
              assert "pywaffle[icons]" in str(exc), f"unhelpful message: {exc}"
          else:
              raise AssertionError("icons should not work without the extra")
          print(f"{sys.argv[1]}: blocks OK, icons refused with instructions")
          PY
          done

      - name: Install each artifact with [icons], and check icons draw
        run: |
          for artifact in dist/*.tar.gz dist/*.whl; do
            rm -rf /tmp/icons-env
            python -m venv /tmp/icons-env
            /tmp/icons-env/bin/pip install --quiet "$artifact[icons]"
            MPLBACKEND=Agg /tmp/icons-env/bin/python - "$artifact" <<'PY'
          import sys
          import matplotlib; matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          from pywaffle import Waffle

          figure = plt.figure(FigureClass=Waffle, rows=5, values=[10, 20], icons="star")
          assert len(figure.axes[0].texts) == 30, "icons did not draw"
          print(f"{sys.argv[1]}[icons]: icons OK")
          PY
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
