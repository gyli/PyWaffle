name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # pandas is not a dependency, but the Series-input tests need it present to run
          pip install pytest pytest-cov pandas

      - name: Test
        env:
          MPLBACKEND: Agg
        run: pytest tests -v --cov=pywaffle --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
        continue-on-error: true

  deprecations:
    # Matplotlib deprecations have broken this package before. Surface them early, without
    # letting them block the merge.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - env:
          MPLBACKEND: Agg
        run: pytest tests -W error::DeprecationWarning -W error::PendingDeprecationWarning

  matplotlib-prerelease:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          pip install -e . pytest
          pip install --upgrade --pre matplotlib
      - env:
          MPLBACKEND: Agg
        run: pytest tests

  images:
    # Image comparison catches regressions that block-by-block assertions cannot: a layout engine
    # change, a matplotlib default moving, a legend drifting over the chart.
    #
    # The baselines are generated on macOS and compared here on Linux. That works because
    # matplotlib ships its own fonts, so text renders identically on both. Regenerate with:
    #   pytest tests/test_images.py --mpl-generate-path=tests/baseline
    # The uploaded summary shows which images differ and by how much when one fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest pytest-mpl
      - name: Compare against baselines
        env:
          MPLBACKEND: Agg
        run: >
          pytest tests/test_images.py --mpl
          --mpl-generate-summary=html
          --mpl-results-path=image-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-comparison-results
          path: image-results/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install black
      - run: black --check --diff pywaffle tests

  build:
    # The package was unbuildable by every PEP 517 frontend for two years because nothing
    # ever tried. This job tries.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      - name: Install the sdist into a clean environment
        run: |
          python -m venv /tmp/sdist-env
          /tmp/sdist-env/bin/pip install dist/*.tar.gz
          MPLBACKEND=Agg /tmp/sdist-env/bin/python -c "
          import matplotlib.pyplot as plt
          from pywaffle import Waffle
          plt.figure(FigureClass=Waffle, rows=5, values=[10, 20], icons='star')
          print('sdist OK')
          "

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          MPLBACKEND=Agg /tmp/wheel-env/bin/python -c "
          import matplotlib.pyplot as plt
          from pywaffle import Waffle
          plt.figure(FigureClass=Waffle, rows=5, values=[10, 20], icons='star')
          print('wheel OK')
          "

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
